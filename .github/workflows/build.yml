name: Spring Boot CI

on:
  push:
    branches:
      - feature/student-api

  pull_request:
    branches:
      - feature/student-api

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build Maven project
        run: mvn clean package

      - name: Build Docker image
        run: docker build -t springstudoc .
